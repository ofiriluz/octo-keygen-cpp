name: windows

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [windows-2019]
        platform: [Win32, x64]
        toolset: [v142]
        build_type: [Debug, Release]
    steps:
    - uses: actions/checkout@v3
    - name: Create Build Environment
      run: |
        cmake -E make_directory ${{runner.workspace}}/build
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.8"
    - name: Install Conan
      shell: bash
      run: |
        pip3 install "conan<2"
    - name: Configure Conan profile
      shell: bash
      run: |
        conan profile new default --detect
        conan profile update settings.build_type=${{matrix.build_type}} default
    - name: Build dependency octo-logger-cpp from source
      working-directory: ${{runner.workspace}}
      shell: bash
      env:
        OCTO_LOGGER_CPP_VERSION: 2.5.2
      run: |
        git clone --depth 1 --branch "v${OCTO_LOGGER_CPP_VERSION}" \
          https://github.com/ofiriluz/octo-logger-cpp.git octo-logger-cpp-src
        conan create octo-logger-cpp-src --build=missing \
          -s build_type=${{matrix.build_type}}
    - name: Consume conan
      working-directory: ${{runner.workspace}}\\build
      shell: bash
      run: |
        conan install $GITHUB_WORKSPACE --build=missing
    - name: Build and test conan
      working-directory: ${{runner.workspace}}\\build
      shell: bash
      run: |
        conan build $GITHUB_WORKSPACE
    - name: Package conan
      working-directory: ${{runner.workspace}}\\build
      shell: bash
      run: |
        conan export-pkg $GITHUB_WORKSPACE
